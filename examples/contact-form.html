<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Form Example</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem; }
      label, fieldset { display: grid; gap: .35rem; margin-block: 1rem; }
      input, textarea, button { font: inherit; padding: .65rem; }
      button { cursor: pointer; }
    </style>
  </head>
  <body>
    <form id="contact-form">
      <label>
        Name
        <input name="name" type="text" required minlength="2" maxlength="100">
      </label>
      <label>
        Email
        <input name="email" type="email" required maxlength="254">
      </label>
      <fieldset>
        <legend>Topic</legend>
        <label><input name="topic" type="radio" value="sales" required> Sales</label>
        <label><input name="topic" type="radio" value="support"> Support</label>
      </fieldset>
      <label>
        Message
        <textarea name="message" maxlength="2000"></textarea>
      </label>
      <label hidden>
        Website
        <input name="_website" tabindex="-1" autocomplete="off">
      </label>
      <button type="submit">Send</button>
      <p id="result" role="status" aria-live="polite"></p>
    </form>
    <script>
      const endpoint = 'http://localhost:3000/v1/forms/REPLACE_PUBLIC_KEY/submissions';
      const form = document.querySelector('#contact-form');
      const result = document.querySelector('#result');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        result.textContent = 'Sending...';
        const data = Object.fromEntries(new FormData(form));

        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Idempotency-Key': crypto.randomUUID()
            },
            body: JSON.stringify(data)
          });
          const body = await response.json();
          if (!response.ok) throw new Error(body.detail || 'Submission failed');
          result.textContent = body.message;
          form.reset();
        } catch (error) {
          result.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
