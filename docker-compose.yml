services:
  app:
    image: ${IMAGE:-kirandhakal/contact-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped

    env_file:
      - .env.docker

    ports:
      - "${APP_PORT:-3100}:3100"

    networks:
      - shared-postgres

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3100/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    image: ${IMAGE:-kirandhakal/contact-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped

    env_file:
      - .env.docker

    command: ["node", "dist/worker.js"]

    networks:
      - shared-postgres

networks:
  shared-postgres:
    external: true
    name: pandanestbacked_pandanest-network
